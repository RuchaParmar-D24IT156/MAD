name: sakshmseva
description: "SakshmSeva Gujarat – Unified citizen services platform for Gujarat government schemes."
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^13.2.1

  # Firebase
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.3
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.4
  google_sign_in: ^6.2.1

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Utilities
  http: ^1.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.7
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/sectors/
    - assets/icons/
    - assets/data/
